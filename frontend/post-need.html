<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post a Need | ReLife</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="index.html" class="logo">
        ♻ Re<span class="logo-highlight">Life</span>
      </a>
      <a href="marketplace.html" class="login-btn">Marketplace</a>
    </header>

    <main class="section">
      <div class="section-heading">
        <span class="eyebrow">COMMUNITY SUPPORT</span>
        <h2>Post Your Need</h2>
        <p>Tell the community what you're looking for.</p>
      </div>

      <form id="postNeedForm">
        <label for="needTitle">What do you need?</label>
        <input
          type="text"
          id="needTitle"
          required
          placeholder="e.g. Engineering textbooks"
        />

        <label for="needDescription">Description</label>
        <textarea
          id="needDescription"
          required
          placeholder="Describe what you are looking for"
        ></textarea>

        <label for="needCategory">Category</label>
        <select id="needCategory" required>
          <option value="">Select Category</option>
          <option value="electronics">Electronics</option>
          <option value="clothing">Clothing</option>
          <option value="furniture">Furniture</option>
          <option value="books">Books</option>
          <option value="sports">Sports</option>
          <option value="others">Others</option>
        </select>

        <label for="needLocation">Your Location</label>
        <input
          type="text"
          id="needLocation"
          required
          placeholder="Enter your city or area"
        />

        <button type="submit" class="primary-btn">Submit Need</button>

        <p id="postNeedMessage" hidden></p>
      </form>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
